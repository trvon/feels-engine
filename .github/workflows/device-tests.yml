name: Device tests

# Instrumented tests (SQLite index, DataStore) on the oldest supported Android (9) through
# current. Slow, so on demand and weekly. The full smoke walk (live engine, screen saver,
# rotation) drives system UI and runs locally: scripts/smoke-matrix.sh (docs/build.md).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  connected:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 30, 33, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
