name: Release

# Push a tag like v0.2.0 to build a signed release APK and attach it to a
# GitHub Release. Signing needs four repository secrets; see docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing; see docs/release.md"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Signed release APK
        env:
          FENGINE_KEYSTORE: ${{ runner.temp }}/release.jks
          FENGINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FENGINE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FENGINE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "feels-engine-${GITHUB_REF_NAME}.apk"
      - name: Checksum
        run: sha256sum "feels-engine-${GITHUB_REF_NAME}.apk" > "feels-engine-${GITHUB_REF_NAME}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            feels-engine-${{ github.ref_name }}.apk
            feels-engine-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
