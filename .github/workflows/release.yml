name: Release

# Builds the signed release APK and Play bundle for a tag and attaches them to
# its GitHub Release. Normally called by release-please.yml after a release PR
# is merged; a hand-pushed tag like v0.3.0 still works. Signing needs four
# repository secrets; see docs/release.md.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing; see docs/release.md"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Signed release APK and Play bundle
        env:
          FENGINE_KEYSTORE: ${{ runner.temp }}/release.jks
          FENGINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FENGINE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FENGINE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Name the artifacts after the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "feels-engine-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "feels-engine-${TAG}.aab"
          sha256sum "feels-engine-${TAG}.apk" "feels-engine-${TAG}.aab" > "feels-engine-${TAG}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            feels-engine-${{ inputs.tag || github.ref_name }}.apk
            feels-engine-${{ inputs.tag || github.ref_name }}.aab
            feels-engine-${{ inputs.tag || github.ref_name }}.sha256
          # release-please writes the notes; a hand-pushed tag gets GitHub's.
          generate_release_notes: ${{ github.event_name == 'push' }}
