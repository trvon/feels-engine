name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and properties
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      # Libraries add permissions when manifests merge; check what the APK actually declares.
      - name: Merged manifest promises (no network, no broad photo access)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          perms=$("$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          if echo "$perms" | grep -E "android.permission.(INTERNET|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_VISUAL_USER_SELECTED|READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)'"; then
            echo "::error::The APK declares a permission the privacy policy rules out"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: feels-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # The minified build on an emulator: R8 broke ML Kit in 0.9.0 and 0.9.1 while every debug check
  # passed. Signed with the debug key here only (-PciDebugSigning).
  release-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Release APK (debug-signed)
        run: ./gradlew :app:assembleRelease -PciDebugSigning --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          script: bash scripts/release-probe.sh emulator-5554
