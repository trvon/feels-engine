name: Pages

# Publishes site/ (landing page and privacy policy) to GitHub Pages, with the
# README screenshots copied in. Enable Pages once: Settings > Pages > Source:
# GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots/raw
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp docs/screenshots/raw/*.png _site/screenshots/raw/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
